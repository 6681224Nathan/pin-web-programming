<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form: Post Method</title>
</head>
<body>
    <form action="/showData" method="post">
        First Name: <input type="text" name="fname" placeholder="tom" required><br>
        Last Name: <input type="text" name="lname" placeholder="cat" required><br>
        Input 1: <input type="number" name="input1" placeholder="2" required><br>
        Input 2: <input type="number" name="input2" placeholder="3" required><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
